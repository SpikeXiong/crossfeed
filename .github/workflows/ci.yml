name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is currently windows-2025 / VS 2026; Node 22's
        # node-gyp 11 cannot detect that toolchain (better-sqlite3 compile).
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: ['22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke check (production start)
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production CROSSFEED_PORT=4000 node backend/dist/server.js &
          SERVER_PID=$!
          sleep 3
          body="$(curl -sf http://127.0.0.1:4000/api/health)" || { echo "health curl failed"; exit 1; }
          printf '%s\n' "$body"
          printf '%s\n' "$body" | grep -q '"ok"' || { echo "health failed"; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //F //IM node.exe 2>/dev/null || true
          else
            kill "$SERVER_PID"
          fi

  lint-shell:
    name: shellcheck install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./deploy
          additional_files: start.sh
          ignore_paths: opencli-clis

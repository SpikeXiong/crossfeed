# Crossfeed 自托管 Docker Compose
# 用法：
#   cp backend/.env.local.example backend/.env.local  # 填 key
#   docker-compose up -d
#   打开 http://localhost:8080

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crossfeed-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.local
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
    expose:
      - "4000"
    # 如果需要 OpenCLI 持久登录状态，把 ~/.opencli 挂进去：
    # volumes:
    #   - ~/.opencli:/root/.opencli:ro

  # Caddy 反代 + 自动 HTTPS（生产推荐）
  caddy:
    image: caddy:2-alpine
    container_name: crossfeed-caddy
    restart: unless-stopped
    ports:
      - "8080:80"      # HTTP
      - "8443:443"     # HTTPS（如果你配了证书）
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # 前端静态文件服务（nginx）
  frontend:
    image: nginx:alpine
    container_name: crossfeed-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"      # 或者用 Caddy 统一暴露 8080
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config: